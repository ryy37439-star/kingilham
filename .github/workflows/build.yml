name: Build APK by king ilham
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'KI_EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KingIlham"
          include(":app")
          KI_EOF_0
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'KI_EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KI_EOF_1
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'KI_EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          KI_EOF_2
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'KI_EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.kingilham.smooth"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.kingilham.smooth"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          KI_EOF_3
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'KI_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="by king ilham"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_overlay_panel" />
                  </service>
              </application>
          </manifest>
          KI_EOF_4
          mkdir -p "$(dirname 'app/src/main/java/com/kingilham/smooth/MainActivity.kt')"
          cat > 'app/src/main/java/com/kingilham/smooth/MainActivity.kt' <<'KI_EOF_5'
          package com.kingilham.smooth

          import android.Manifest
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.app.Activity

          class MainActivity : Activity() {

              private val REQ_IMG = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                      setBackgroundColor(0xFF12121A.toInt())
                  }

                  root.addView(TextView(this).apply {
                      text = "by king ilham"
                      textSize = 26f
                      setTextColor(0xFFFF7BD5.toInt())
                      gravity = Gravity.CENTER
                  })

                  fun btn(label: String, action: () -> Unit) {
                      root.addView(Button(this).apply {
                          text = label
                          setOnClickListener { action() }
                      })
                  }

                  btn("1. Izin Overlay (tampil di atas game)") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }
                  btn("2. Izin Ubah Pengaturan Sistem") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_WRITE_SETTINGS,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }
                  btn("3. Pilih Background (foto anime)") {
                      val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "image/*"
                          addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or
                                  Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          )
                      }
                      startActivityForResult(i, REQ_IMG)
                  }
                  btn("4. MULAI (munculkan tombol mengambang)") {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Aktifkan izin overlay dulu", Toast.LENGTH_SHORT).show()
                      } else {
                          val s = Intent(this, FloatingService::class.java)
                          startForegroundService(s)
                          moveTaskToBack(true)
                      }
                  }
                  btn("Hentikan") { stopService(Intent(this, FloatingService::class.java)) }

                  setContentView(root)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_IMG && resultCode == RESULT_OK && data?.data != null) {
                      val uri = data.data!!
                      try {
                          contentResolver.takePersistableUriPermission(
                              uri, Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {}
                      getSharedPreferences("ki", MODE_PRIVATE).edit()
                          .putString("bg", uri.toString()).apply()
                      Toast.makeText(this, "Background disimpan", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          KI_EOF_5
          mkdir -p "$(dirname 'app/src/main/java/com/kingilham/smooth/FloatingService.kt')"
          cat > 'app/src/main/java/com/kingilham/smooth/FloatingService.kt' <<'KI_EOF_6'
          package com.kingilham.smooth

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*

          class FloatingService : Service() {

              private lateinit var wm: WindowManager
              private var bubble: View? = null
              private var panel: View? = null
              private var panelShown = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  createBubble()
                  createPanel()
              }

              private fun startAsForeground() {
                  val ch = "ki_channel"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(ch, "by king ilham", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, ch)
                      .setContentTitle("by king ilham aktif")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .build()
                  startForeground(1, n)
              }

              private fun overlayParams(w: Int, h: Int) = WindowManager.LayoutParams(
                  w, h,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                  PixelFormat.TRANSLUCENT
              )

              // ---------- Tombol bulat mengambang ----------
              private fun createBubble() {
                  val tv = TextView(this).apply {
                      text = "KI"
                      textSize = 16f
                      setTextColor(0xFFFFFFFF.toInt())
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xCCFF4FB8.toInt())
                          setStroke(dp(2), 0xFFFFFFFF.toInt())
                      }
                  }
                  val lp = overlayParams(dp(52), dp(52)).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(8); y = dp(200)
                  }

                  var sx = 0; var sy = 0; var tx = 0f; var ty = 0f; var moved = false
                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = lp.x; sy = lp.y; tx = e.rawX; ty = e.rawY; moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tx).toInt(); val dy = (e.rawY - ty).toInt()
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true
                              lp.x = sx + dx; lp.y = sy + dy
                              wm.updateViewLayout(tv, lp)
                          }
                          MotionEvent.ACTION_UP -> if (!moved) togglePanel()
                      }
                      true
                  }
                  wm.addView(tv, lp)
                  bubble = tv
              }

              // ---------- Panel dengan slider ----------
              private fun createPanel() {
                  val prefs = getSharedPreferences("ki", MODE_PRIVATE)

                  val root = FrameLayout(this).apply {
                      background = GradientDrawable().apply {
                          cornerRadius = dp(18).toFloat()
                          setColor(0xFF1B1B26.toInt())
                      }
                      clipToOutline = true
                  }

                  // Background anime dari galeri pengguna
                  prefs.getString("bg", null)?.let { s ->
                      try {
                          contentResolver.openInputStream(Uri.parse(s))?.use { st ->
                              val opt = BitmapFactory.Options().apply { inSampleSize = 3 }
                              val bmp = BitmapFactory.decodeStream(st, null, opt)
                              root.addView(ImageView(this).apply {
                                  setImageBitmap(bmp)
                                  scaleType = ImageView.ScaleType.CENTER_CROP
                              }, FrameLayout.LayoutParams(-1, -1))
                          }
                      } catch (_: Exception) {}
                  }
                  // Lapisan gelap biar tulisan kebaca
                  root.addView(View(this).apply { setBackgroundColor(0x99000000.toInt()) },
                      FrameLayout.LayoutParams(-1, -1))

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }

                  col.addView(TextView(this).apply {
                      text = "by king ilham"
                      textSize = 18f
                      setTextColor(0xFFFF9EDB.toInt())
                  })

                  val label = TextView(this).apply {
                      setTextColor(0xFFFFFFFF.toInt())
                      textSize = 14f
                      setPadding(0, dp(10), 0, 0)
                  }
                  col.addView(label)

                  val saved = prefs.getInt("level", 50)
                  label.text = "Kelicinan: $saved%"

                  val seek = SeekBar(this).apply {
                      max = 100
                      progress = saved
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                              label.text = "Kelicinan: $p%"
                              applyLevel(p)
                              prefs.edit().putInt("level", p).apply()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  col.addView(seek)

                  col.addView(Button(this).apply {
                      text = "Tutup panel"
                      setOnClickListener { togglePanel() }
                  })
                  col.addView(Button(this).apply {
                      text = "Matikan aplikasi"
                      setOnClickListener { stopSelf() }
                  })

                  root.addView(col, FrameLayout.LayoutParams(-1, -2))
                  panel = root
              }

              // 0..100 -> pointer_speed -7..7
              private fun applyLevel(p: Int) {
                  if (!Settings.System.canWrite(this)) return
                  val v = Math.round(p / 100f * 14f) - 7
                  try {
                      Settings.System.putInt(contentResolver, "pointer_speed", v)
                  } catch (_: Exception) {}
              }

              private fun togglePanel() {
                  val p = panel ?: return
                  if (panelShown) {
                      wm.removeView(p)
                  } else {
                      // FLAG_NOT_FOCUSABLE tetap dipakai, slider tetap bisa disentuh
                      val lp = overlayParams(dp(300), WindowManager.LayoutParams.WRAP_CONTENT)
                          .apply { gravity = Gravity.CENTER }
                      wm.addView(p, lp)
                  }
                  panelShown = !panelShown
              }

              override fun onDestroy() {
                  bubble?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  if (panelShown) panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  super.onDestroy()
              }
          }
          KI_EOF_6
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: by king ilham v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
